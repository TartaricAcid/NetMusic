plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

allprojects {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        mavenLocal()
        mavenCentral()
    }
}

repositories {
    flatDir {
        dir "libs"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        // Patchouli
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    maven {
        name 'terraformersmc Maven'
        url "https://maven.terraformersmc.com"
    }
    maven {
        url "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel.cloth"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    maven {
        url = "https://mvn.devos.one/releases/"
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

loom {
    mods {
        "netmusic" {
            sourceSet sourceSets.main
        }
    }
    accessWidenerPath = file("src/main/resources/netmusic.accesswidener")
    runs {
        client {
            ideConfigGenerated = true
            programArgs("--username", "_IMG_")
            vmArg("-Djdk.httpclient.HttpClient.log=requests,responses,headers,errors")
        }

        server {
            ideConfigGenerated = true
            runDir = "run/server"
        }
    }
    runConfigs.configureEach {
        ideConfigGenerated = true
    }
}

configurations {
    shadowLib
    implementation.extendsFrom shadowLib
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Fabric Loader
    implementation  "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API
    implementation  "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // mp3 解码库
    shadowLib("com.googlecode.soundlibs:mp3spi:1.9.5.4")
    // flac 解码库
    shadowLib("libs:jflac-codec-1.5.3:SNAPSHOT")
    // AAC 解码库
    shadowLib("libs:javasound-aac:0.9.6")

    // JEI
    runtimeOnly("maven.modrinth:jei:${jei_version}")

    // ModMenu
    implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    // Cloth Config API
    implementation("maven.modrinth:cloth-config:${project.cloth_config_version}")
    implementation("me.shedaniel.cloth:basic-math:0.6.1")

    // IPN
    // runtimeOnly("maven.modrinth:fabric-language-kotlin:${project.fabric_language_kotlin_version}")
    // implementation("maven.modrinth:libipn:${project.libipn_version}")
    // implementation("maven.modrinth:inventory-profiles-next:${project.inventory_profiles_next_version}")

    // Forge Config API Port (Fabric build, from local libs)
    implementation(files("libs/ForgeConfigAPIPort-v26.2.1-mc26.2.x-Fabric.jar"))
    implementation("com.electronwill.night-config:core:3.8.0")
    implementation("com.electronwill.night-config:toml:3.8.0")

    // 车万女仆: 织姬
    // implementation("maven.modrinth:touhoulittlemaid-orihime:${project.touhoulittlemaid_orihime_version}")
    // implementation("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    // implementation("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
    // implementation("org.openjdk.nashorn:nashorn-core:15.4")

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
}

shadowJar {
    configurations = [project.configurations.shadowLib]

    dependencies {
        exclude(dependency('junit:junit'))
    }

    relocationPrefix = "com.github.tartaricacid.netmusic.soundlibs"
    enableAutoRelocation = true

    // 排除不需要的依赖项和资源
    exclude 'META-INF/maven/**/*'
    exclude 'META-INF/versions/**/*'
    // 这个版权许可都已经手动添加进 licenses 里了
    exclude 'META-INF/LICENSE'

    // shadow 认为来自不同音频库的同名 service 文件是重复的
    // duplicatesStrategy 的默认值 EXCLUDE 会排除掉重复的 service 文件, 只保留第一个
    // INCLUDE 则能保证 service 文件能被正常合并
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

assemble {
    dependsOn shadowJar
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}