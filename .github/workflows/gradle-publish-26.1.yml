name: Gradle Package 26.1

on:
  workflow_dispatch:
  push:
    branches:
      - "26.1"
    paths:
      - 'src/main/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build runGameTestServer -x test --build-cache --parallel

      - name: Rename Build Artifacts
        run: |
          cd ./build/libs/
          # 找到以 -all.jar 结尾的文件，将其更名为包含 snapshot 的名称
          for f in *-all.jar; do
            mv "$f" "${f%-all.jar}-snapshot.jar"
          done
          # 查看一下结果，方便在日志里调试
          ls -R

      - name: Create timestamp
        id: create_timestamp
        run: echo "timestamp=$(date '+%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Send file to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: snapshot-${{ steps.create_timestamp.outputs.timestamp }}
          generate_release_notes: true
          body: |
            
            ${{ github.event.head_commit.message }}

          draft: false
          prerelease: true
          files: |
            build/libs/*-snapshot.jar
            build/libs/*-sources.jar